name: food_track
description: "A new Flutter project for Food Mela food delivery application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  smooth_page_indicator: ^2.0.1
  flutter_animate: ^4.5.2
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.1
  geolocator: ^13.0.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  flutter_ringtone_player: ^4.0.0+4
  url_launcher: ^6.3.2
  agora_rtc_engine: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
